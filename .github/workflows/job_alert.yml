name: Daily AI Job Alert

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 08:00 AM MYT (00:00 UTC)
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Hours back to scan (e.g., 24 for daily, 168 for 7 days)'
        required: false
        default: '24'
      ignore_seen:
        description: 'Re-evaluate already seen jobs? (true/false)'
        required: false
        default: 'false'
      max_jobs:
        description: 'Max jobs to evaluate (1-50)'
        required: false
        default: '15'
      min_match_score:
        description: 'Minimum AI match score (1-10)'
        required: false
        default: '7'
      search_location:
        description: 'Target location'
        required: false
        default: 'Malaysia'
      search_queries:
        description: 'Custom search queries (comma or newline separated, optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scan-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install apify-client google-genai pydantic

      - name: Run job alert
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          HOURS_BACK: ${{ inputs.hours_back || vars.HOURS_BACK || '24' }}
          IGNORE_SEEN: ${{ inputs.ignore_seen || vars.IGNORE_SEEN || 'false' }}
          MAX_JOBS: ${{ inputs.max_jobs || vars.MAX_JOBS || '15' }}
          MIN_MATCH_SCORE: ${{ inputs.min_match_score || vars.MIN_MATCH_SCORE || '7' }}
          SEARCH_LOCATION: ${{ inputs.search_location || vars.SEARCH_LOCATION || 'Malaysia' }}
          SEARCH_QUERIES: ${{ inputs.search_queries || vars.SEARCH_QUERIES || '' }}
        run: python job_alert.py

      - name: Commit updated state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json docs/index.html
          git diff --staged --quiet || git commit -m "chore: update job radar matches and dashboard"
          git push
